[package]
name = "tauri-plugin-electron"
version = "0.1.0"
description = "Native half of tauri-electron: registers the official Tauri plugins Electron's API is built on, grants Electron's default capabilities, and covers what those plugins cannot."
edition = "2021"
license = "0BSD"
links = "tauri-plugin-electron"

# Every Electron module that needs an official Tauri plugin is a feature.
# `Builder::install` registers the plugins of the enabled features and grants
# the main window their permissions, so toggling a feature is all it takes.
# The defaults match what Electron offers out of the box; the rest is opt-in,
# like in Electron.
[features]
default = [
  "dialog",
  "clipboard",
  "notification",
  "shell",
  "net",
  "global-shortcut",
  "tray",
  "protocol-client",
  "login-item",
  "power-save-blocker",
  "power-monitor",
  "safe-storage",
]
# dialog.* (including the *Sync variants)
dialog = ["dep:tauri-plugin-dialog"]
# clipboard.*
# (arboard: clipboard.readHTML and the synchronous reads of Electron < 45)
clipboard = ["dep:tauri-plugin-clipboard-manager", "dep:arboard"]
# Notification (with click / action / close events on desktop)
notification = ["dep:tauri-plugin-notification"]
# shell.openExternal / openPath / showItemInFolder
shell = ["dep:tauri-plugin-opener"]
# net.fetch / net.request (and autoUpdater downloads)
net = ["dep:tauri-plugin-http"]
# globalShortcut
global-shortcut = ["dep:tauri-plugin-global-shortcut"]
# Tray
tray = ["tauri/tray-icon"]
# app.setAsDefaultProtocolClient & co.
protocol-client = ["dep:tauri-plugin-deep-link"]
# app.setLoginItemSettings / getLoginItemSettings
login-item = ["dep:tauri-plugin-autostart"]
# powerSaveBlocker with operating-system assertions (otherwise a Screen Wake
# Lock in a visible window).
power-save-blocker = ["dep:keepawake"]
# powerMonitor's suspend / resume / lock-screen / unlock-screen / shutdown
# events and getSystemIdleTime / getSystemIdleState (D-Bus on Linux; idle
# time only on macOS and Windows).
power-monitor = ["dep:zbus"]
# safeStorage: a random key kept in the OS keychain (Keychain, Credential
# Manager, Secret Service) and AES-256-GCM.
safe-storage = ["dep:keyring", "dep:aes-gcm"]

# --- opt-in ------------------------------------------------------------------------
# app.requestSingleInstanceLock() / 'second-instance'. Electron apps allow several
# instances unless they ask for the lock, so this is off by default.
single-instance = ["dep:tauri-plugin-single-instance"]
# autoUpdater. Needs `plugins.updater` (endpoints, public key) in tauri.conf.json.
updater = ["dep:tauri-plugin-updater"]
# webContents.openDevTools() in release builds (Tauri's `devtools` feature; uses
# private APIs on macOS, so not App Store compatible).
devtools = ["tauri/devtools"]
# session.setProxy on macOS (needs macOS 14; Tauri's `macos-proxy` feature).
macos-proxy = ["tauri/macos-proxy"]

# --- Node built-ins backed by Rust ---------------------------------------------------
# Not in `default`: apps list them explicitly in src-tauri/Cargo.toml (the
# scaffolder and the template do), so the native access an app has is visible
# and a dependent app does not gain it silently on update.
# fs, fs/promises (and original-fs): file system access from the main process.
# fs.watch / fs.promises.watch use the notify crate (inotify, FSEvents, ReadDirectoryChangesW).
node-fs = ["dep:notify"]
# os: host, user, memory, CPUs, network interfaces.
node-os = ["dep:sysinfo"]
# child_process: runs arbitrary commands, like Electron's main process can.
node-child-process = []
# net, dgram, dns, and the servers of http / https: sockets from the main process.
node-net = ["dep:tokio", "dep:socket2", "dep:hickory-resolver"]
# tls (and https servers): TLS over node-net's sockets, with rustls.
node-tls = ["node-net", "dep:rustls", "dep:tokio-rustls", "dep:webpki-roots", "dep:rustls-pki-types"]

# --- npm packages with native code, aliased by the bundler plugins ---------------------
# Opt-in like the node-* features, for the same reason: each gives the main process
# (and nodeIntegration windows) native access an app should list explicitly. The
# scaffolder (`--into`) enables those whose npm package the app depends on.
# keytar: passwords in the OS keychain (Keychain, Credential Manager, Secret Service),
# stored where keytar stores them, so an app's existing entries are found.
keytar = ["dep:keyring", "dep:dbus-secret-service", "dep:security-framework", "dep:windows-sys"]
# better-sqlite3 and sqlite3: SQLite compiled into the app (rusqlite's `bundled`;
# no system library, but a C compiler at build time). Reads and writes any file.
sqlite = ["dep:rusqlite"]
# node-pty: pseudo-terminals (portable-pty). Runs arbitrary programs, like child_process.
pty = ["dep:portable-pty"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
# image-png / image-ico: icons passed as bytes (nativeImage, Tray, BrowserWindow#setIcon).
tauri = { version = "2", features = ["image-png", "image-ico"] }
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-http = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
# Sockets for net / dgram / dns (feature node-net); Tauri already runs tokio.
tokio = { version = "1", optional = true, features = ["net", "io-util", "sync", "rt", "time", "macros"] }
socket2 = { version = "0.6", optional = true, features = ["all"] }
hickory-resolver = { version = "0.26", optional = true, default-features = false, features = ["tokio", "system-config"] }
# tls (feature node-tls): the rustls / ring stack tauri-plugin-http already uses.
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = { version = "1", optional = true }
rustls-pki-types = { version = "1.12", optional = true, features = ["std"] }
# os.cpus(), totalmem(), freemem(), loadavg(), uptime(), networkInterfaces() (feature node-os).
# fs.watch (feature node-fs).
notify = { version = "8", optional = true }
# safeStorage (feature safe-storage).
aes-gcm = { version = "0.10", optional = true }
sysinfo = { version = "0.40", optional = true, default-features = false, features = ["system", "network"] }
# better-sqlite3 / sqlite3 (feature sqlite): SQLite built from source.
rusqlite = { version = "0.43", optional = true, default-features = false, features = ["bundled", "cache", "backup", "column_decltype", "column_metadata", "functions", "serialize"] }
# node-pty (feature pty).
portable-pty = { version = "0.9", optional = true }

[target.'cfg(unix)'.dependencies]
# access(2) and errno constants for the Node `fs` error codes (feature node-fs).
libc = "0.2"

# WebKitGTK webviews of BrowserWindows: downloads and permission requests
# (the version wry uses, so nothing more is built).
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5"
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
arboard = { version = "3", optional = true }
keepawake = { version = "0.6", optional = true }
# safeStorage's key (feature safe-storage): Keychain, Credential Manager, Secret Service.
keyring = { version = "3.6", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# logind and screen-saver signals for powerMonitor (feature power-monitor);
# already in the build through tauri-plugin-notification and keepawake.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus = { version = "5", optional = true }
# keytar's Secret Service items (feature keytar): the crate keyring is built on,
# used directly for keytar's attributes and for findCredentials.
dbus-secret-service = { version = "4.1", optional = true, features = ["crypto-rust"] }

# keytar's findCredentials on macOS (feature keytar): a keychain search, which keyring lacks.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }

# keytar's findCredentials on Windows (feature keytar): CredEnumerateW, which keyring lacks.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", optional = true, features = ["Win32_Foundation", "Win32_Security_Credentials"] }
