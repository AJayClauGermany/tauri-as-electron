[package]
name = "tauri-electron-app"
version = "0.1.0"
description = "A Tauri app written against the Electron API (via tauri-electron)"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "tauri_electron_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: Electron's Tray. image-png/image-ico: icons passed as bytes (nativeImage, Tray, setIcon).
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
