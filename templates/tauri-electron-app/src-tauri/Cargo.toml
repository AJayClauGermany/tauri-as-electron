[package]
name = "tauri-electron-app"
version = "0.1.0"
description = "A Tauri app written against the Electron API (via tauri-electron)"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "tauri_electron_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# tauri-electron's native half. It registers the official Tauri plugins the
# Electron API is built on and grants the main window their permissions, so
# the features below are the only switch. Defaults: "dialog", "clipboard",
# "notification", "shell", "net", "global-shortcut", "tray", "protocol-client",
# "login-item". Opt-in, like in Electron: "single-instance", "updater"
# (needs `plugins.updater` in tauri.conf.json), "devtools" (release builds).
# Add opt-in ones with e.g. `features = ["single-instance"]`; to drop defaults,
# set `default-features = false` and list the ones you keep.
# Node built-ins backed by Rust are listed explicitly below so you can see the
# native access the app has; delete a line to turn one off.
# Until tauri-electron is published, a copy outside this repository should use
# `git = "https://github.com/AJayClauGermany/tauri-as-electron"` instead of `path`
# (the scaffolder, `npx github:AJayClauGermany/tauri-as-electron my-app`, does that).
tauri-plugin-electron = { path = "../../../crates/tauri-plugin-electron", features = [
  "node-fs",            # fs, fs/promises: file access from the main process
  "node-os",            # os: host, user, memory, CPUs, network interfaces
  "node-child-process", # child_process: runs arbitrary commands; delete to disable
] }
