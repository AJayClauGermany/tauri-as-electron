name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev xvfb
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: tauri-plugin-electron compiles with all / no optional features
        run: |
          cargo check -p tauri-plugin-electron --all-features
          cargo check -p tauri-plugin-electron --no-default-features
      - name: Kitchen sink on Tauri (build + automatic checks)
        run: npm run kitchen-sink:smoke
      - name: Template builds
        run: npm run build --workspace tauri-electron-app -- --debug --no-bundle
      - name: Repository root packs as the tauri-electron package
        run: npm pack --dry-run
      - name: Scaffolded app installs the packed root and builds its frontend
        run: |
          npm pack --pack-destination /tmp
          node scripts/create-app.mjs /tmp/scaffolded --name scaffolded
          cd /tmp/scaffolded
          npm pkg set "dependencies.tauri-electron=file:$(ls /tmp/tauri-as-electron-*.tgz)"
          npm install
          npx vite build
          test -f dist/electron-main.html
