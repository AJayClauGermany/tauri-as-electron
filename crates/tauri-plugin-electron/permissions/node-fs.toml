"$schema" = "schemas/schema.json"

[[set]]
identifier = "node-fs"
description = "Node's `fs` and `fs/promises` (Cargo feature `node-fs`): read and write any file the app's user can. Granted to the `electron-main` window when the feature is on, and to windows the main process creates with `nodeIntegration` or `sandbox: false` (as in Electron). Do not grant it to other renderer windows."
permissions = ["allow-node-fs"]
